language: python
os: linux
dist: xenial

before_install:
  - env
  - openssl version
  - python -c "import ssl; print(ssl.OPENSSL_VERSION)"

install:
  - ./ci/install.sh

script:
  - ./ci/run.sh

cache:
  directories:
  - ${HOME}/.cache

notifications:
  email: false

env:
  global:
    - PYTHONWARNINGS=always::DeprecationWarning

    - PYPI_USERNAME=urllib3
    # PYPI_PASSWORD is set in Travis control panel.

    # Resolve nox and the test dependency graph through the registry time
    # machine. 2022-07-15, not the 2020-10-19 release date: pytest 4.6.9 needs
    # atomicwrites, whose whole PyPI file history was re-uploaded on 2022-07-09,
    # so earlier dates give "No matching distribution found for atomicwrites".
    # Same date the macOS/Windows legs in .github/workflows/ci.yml use.
    - PIP_INDEX_URL=https://:2022-07-15@time-machines-pypi.sealsecurity.io/

jobs:
  include:
    # Lint (flake8/black) and docs (sphinx -W) gates dropped: they never execute the library code.

    # Unit tests
    - python: 2.7
      env: NOX_SESSION=test-2.7
    - python: 3.5
      env: NOX_SESSION=test-3.5
    - python: 3.6
      env: NOX_SESSION=test-3.6
    - python: 3.7
      env: NOX_SESSION=test-3.7
    - python: 3.8
      env: NOX_SESSION=test-3.8
    # Was `nightly`: Travis's nightly now resolves to a 3.15 dev build, so the
    # test-3.9 nox session would find no interpreter.
    - python: 3.9
      env: NOX_SESSION=test-3.9
    # PyPy legs dropped: Travis no longer serves pypy2.7-6.0 / pypy3.5-6.0 archives for xenial (404 on travis-ci-language-archives).

    # Extras
    # app_engine leg dropped: gcp-devrel-py-tools download-appengine-sdk lists
    # the retired gs://appengine-sdks bucket, which now answers 401 Unauthorized,
    # so the App Engine SDK cannot be installed.
    - python: 2.7
      env: NOX_SESSION=google_brotli-2
    - python: 3.7
      env: NOX_SESSION=google_brotli-3

    # Downstream integration tests.
    - python: 2.7
      env: DOWNSTREAM=requests
      stage: integration

    - python: 3.7
      env: DOWNSTREAM=requests
      stage: integration

    - python: 2.7
      env: DOWNSTREAM=botocore
      stage: integration

    - python: 3.7
      env: DOWNSTREAM=botocore
      stage: integration

    - python: 3.7
      stage: deploy
      script:
        - ./ci/deploy.sh

stages:
  - name: test
    if: tag IS blank

  # Run integration tests for release candidates
  - name: integration
    if: type = pull_request AND head_branch =~ ^release-[\d.]+$ AND tag IS blank

  # Deploy on any tags
  - name: deploy
    if: tag IS present AND tag =~ /^(\d+\.\d+(?:.\d+)?)$/ AND repo = urllib3/urllib3
